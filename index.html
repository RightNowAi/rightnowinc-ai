<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=https://rightnowinc.com" />
  <meta name="robots" content="noindex" />
  <title>Right Now Inc.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    .message {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #444;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .link:hover { border-color: #ffffff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">RIGHT NOW INC.</div>
    <p class="message">Redirecting you...</p>
    <a class="link" href="https://rightnowinc.com">Click here if you're not redirected</a>
  </div>
  <script>
    window.location.replace("https://rightnowinc.com");
  </script>
</body>
</html>
